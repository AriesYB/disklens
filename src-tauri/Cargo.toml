[package]
name = "disklens"
version = "1.2.1"
description = "DiskLens —— 看清每一寸磁盘：实时 treemap + 列表 + 大文件榜 + junction 迁移"
authors = ["AriesYB"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "disklens_lib"
# 桌面端只需 rlib（bin 直接调 run()）。cdylib 会让 GNU ld 导出数万符号
# （"export ordinal too large"），到 M2/M4 做 Android/iOS 时再加回
# ["staticlib", "cdylib", "rlib"]（MSVC 目标无此限制）。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 枚举本地卷（盘符/文件系统/剩余空间）供迁移目标选择
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

# 应用内自动更新（检查/下载/安装签名更新包）+ 更新后重启 + 原生文件夹选择；仅桌面端
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"

# 扫描完成后的实时监视：跨平台文件系统事件（Windows 走 ReadDirectoryChangesW）
notify = "8"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
