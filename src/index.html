<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/styles.css?v=0.8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiskLens 盘析 — 看清每一寸磁盘</title>
  </head>
  <body data-view="treemap">
    <header id="appbar">
      <div id="brand">
        <span id="brand-glyph"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.6 15.6 21 21"/></svg></span>
        <span id="brand-name">DiskLens <i>盘析</i></span>
      </div>
      <input id="root-input" value="C:\" spellcheck="false" />
      <button id="scan-btn" class="primary">开始扫描</button>
      <button id="stop-btn" disabled>停止</button>
      <span id="status">就绪</span>
    </header>

    <div id="viewbar">
      <nav id="views">
        <button class="seg active" data-view="treemap">方块视图</button>
        <button class="seg" data-view="list">列表视图</button>
        <button class="seg" data-view="files">大文件榜</button>
      </nav>
      <span id="summary"></span>
    </div>

    <div id="bar"></div>

    <main id="content">
      <div id="map"></div>
      <div id="list"></div>
      <div id="files"></div>
      <div id="wait"><div><div class="spin"></div><div style="margin-top:12px">等待扫描开始…</div></div></div>
    </main>

    <footer id="foot">
      <span id="foot-stats"></span>
      <span id="foot-hint"></span>
    </footer>

    <div id="tip"></div>
    <div id="ctx">
      <div id="ctxpath"></div>
      <div class="mi" id="mi-open"><span class="ic">📂</span><span id="mi-open-t">在资源管理器中打开</span></div>
      <div class="mi" id="mi-copy"><span class="ic">📋</span><span id="mi-copy-t">复制完整路径</span></div>
      <div class="sep"></div>
      <div class="mi" id="mi-enter"><span class="ic">↯</span><span>进入此目录</span></div>
      <div class="mi" id="mi-expand"><span class="ic">⊞</span><span id="mi-expand-t">展开</span></div>
      <div class="mi" id="mi-migrate"><span class="ic">📦</span><span>迁移此目录（junction）…</span></div>
    </div>

    <div id="mig-mask" style="display:none">
      <div id="mig">
        <div id="mig-title">迁移目录 <button id="mig-close" title="关闭">✕</button></div>
        <div id="mig-src"></div>
        <div class="mig-row">
          <span class="mig-lab">迁移到</span>
          <select id="mig-vol"></select>
          <span id="mig-vol-info"></span>
        </div>
        <div class="mig-row"><span class="mig-lab">目标路径</span><b id="mig-dest" class="mig-mono"></b></div>
        <div id="mig-check"></div>
        <div id="mig-prog" style="display:none">
          <div id="mig-stage"></div>
          <div class="mig-track"><div id="mig-fill"></div></div>
          <div id="mig-cur" class="mig-mono"></div>
        </div>
        <div id="mig-locked" style="display:none"></div>
        <div id="mig-actions">
          <button id="mig-start" class="primary" disabled>检查中…</button>
          <button id="mig-stop" style="display:none">停止</button>
          <button id="mig-rescan" style="display:none">重新扫描</button>
          <button id="mig-cancel">关闭</button>
        </div>
      </div>
    </div>

    <script src="/treemap.js?v=0.9"></script>
    <script src="/listview.js?v=0.8"></script>
    <script src="/migrate.js?v=0.8"></script>
    <script src="/main.js?v=0.8"></script>
  </body>
</html>
