<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/styles.css?v=0.3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiskLens 盘析</title>
  </head>
  <body>
    <div id="toolbar">
      <span style="color:#7fc7ff;font-weight:600">DiskLens 盘析</span>
      <input id="root-input" value="C:\" spellcheck="false" />
      <button id="scan-btn">开始扫描</button>
      <button id="stop-btn" disabled>停止</button>
      <span id="status"></span>
    </div>
    <div id="bar"></div>
    <div id="map"></div>
    <div id="tip"></div>
    <div id="ctx">
      <div id="ctxpath"></div>
      <div class="mi" id="mi-open"><span class="ic">📂</span><span id="mi-open-t">在资源管理器中打开</span></div>
      <div class="mi" id="mi-copy"><span class="ic">📋</span><span id="mi-copy-t">复制完整路径</span></div>
      <div class="sep"></div>
      <div class="mi" id="mi-enter"><span class="ic">↯</span><span>进入此目录</span></div>
      <div class="mi" id="mi-expand"><span class="ic">⊞</span><span id="mi-expand-t">展开</span></div>
    </div>
    <div id="wait"><div><div class="spin"></div><div style="margin-top:12px">等待扫描开始…</div></div></div>
    <div id="foot">输入根目录后点击「开始扫描」</div>
    <script src="/treemap.js?v=0.3"></script>
    <script src="/main.js?v=0.3"></script>
  </body>
</html>
