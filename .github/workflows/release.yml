# 自动发版：推送 v* 标签 → 测试 → 签名构建 → 自动创建 GitHub Release 并上传产物
#
# 前置（仓库 Settings → Secrets and variables → Actions 配置一次）：
#   TAURI_SIGNING_PRIVATE_KEY           = .tauri/disklens-updater.key 的文件内容（整段粘贴）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  = 私钥密码（没设密码就建一个空字符串 Secret）
#   IKANP_SSH_HOST / IKANP_SSH_USER / IKANP_SSH_KEY（可选）
#                                       = 服务器 SSH 信息，用于 CI 自动同步 latest.json 与版本化安装包
#
# 以后发版只需：
#   1. 升版本号（package.json / package-lock.json / src-tauri/Cargo.toml / src-tauri/tauri.conf.json）
#   2. git tag -a v1.x.0 -m "一句话更新说明" && git push origin v1.x.0
# → 自动跑测试 → 构建 → Release 页面出现 setup.exe/.sig/latest.json/disklens.exe
#   （latest.json 挂在 Release 附件上，老客户端经 GitHub 源自动收到更新提示；
#    ikanp.top 服务器源由 CI 自动同步 latest.json + 版本化安装包，
#    保证与 Release 的 exe 是同一构建、签名必然匹配；
#    未配置 SSH secrets 时才需要手动 scp——切勿用本地构建的清单，签名会对不上）

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # 创建 Release 与上传附件

jobs:
  release:
    runs-on: windows-latest
    env:
      # 供「同步更新清单」/「Authenticode 签名」步骤的条件判断（secrets 不能直接用在 if 里）
      IKANP_SSH_HOST: ${{ secrets.IKANP_SSH_HOST }}
      WINDOWS_SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
      WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 全量历史 + tags；浅克隆取不到 tag 附注，更新弹窗说明会退化

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 发版前全量验证：Rust 测试 + 浏览器 e2e
      - name: Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 安装 e2e 浏览器
        run: npx playwright install chromium
        env:
          PLAYWRIGHT_DOWNLOAD_HOST: https://npmmirror.com/mirrors/playwright/

      - name: e2e 冒烟
        run: npm run e2e

      - name: 签名构建
        run: npm run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 整理免安装版文件名
        shell: bash
        run: |
          cp src-tauri/target/release/disklens.exe "disklens-${{ github.ref_name }}.exe"

      # Authenticode 签名（可选）：仓库 Secrets 配置 WINDOWS_SIGN_PFX（.pfx 文件的 Base64，
      # 含私钥）与 WINDOWS_SIGN_PFX_PASSWORD 后自动生效。作用：UAC/属性里显示"已验证的
      # 发布者"、消除 SmartScreen 未签名警告。与 tauri 更新签名（.sig）相互独立——
      # 签名改变了 exe 字节，下一步会对已签字节重算 .sig
      - name: Authenticode 签名（可选）
        if: env.WINDOWS_SIGN_PFX != ''
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          $b64 = $env:WINDOWS_SIGN_PFX -replace '\s',''
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($b64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -notmatch 'arm' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'runner 上未找到 signtool' }
          $targets = @(
            'src-tauri/target/release/disklens.exe',
            'src-tauri/target/release/bundle/nsis/*-setup.exe',
            "disklens-${{ github.ref_name }}.exe"
          )
          foreach ($pattern in $targets) {
            foreach ($f in (Resolve-Path $pattern)) {
              & $signtool sign /f $pfxPath /p "$env:WINDOWS_SIGN_PFX_PASSWORD" `
                /fd sha256 /tr http://timestamp.digicert.com /td sha256 $f.Path
              if ($LASTEXITCODE -ne 0) { throw "签名失败：$($f.Path)" }
              & $signtool verify /pa $f.Path
              if ($LASTEXITCODE -ne 0) { throw "签名校验失败：$($f.Path)" }
            }
          }
          Remove-Item $pfxPath -Force

      # Authenticode 签名改变了 setup.exe 字节，必须对已签字节重算 tauri 更新签名（.sig），
      # 否则客户端更新报 The signature verification failed（与 v1.2.0 事故同构：签名与
      # exe 字节必须出自同一构建）。未配置 WINDOWS_SIGN_PFX 时跳过，.sig 保持原样
      - name: 重签更新签名（仅 Authenticode 启用时）
        if: env.WINDOWS_SIGN_PFX != ''
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in src-tauri/target/release/bundle/nsis/*-setup.exe; do
            npx tauri signer sign "$f"
          done

      - name: 生成更新清单（说明取自 tag 说明，lightweight tag 时回退 commit 标题）
        shell: bash
        run: |
          git fetch origin --tags --force   # 确保附注 tag 对象在本地（checkout 浅时兜底）
          TAG_MSG="$(git tag -l --format='%(contents:subject)' ${{ github.ref_name }})"
          if [ -z "$TAG_MSG" ]; then TAG_MSG="$(git log -1 --format='%s')"; fi
          if [ -z "$TAG_MSG" ]; then TAG_MSG="性能优化与问题修复。"; fi
          node scripts/gen-updater-manifest.mjs "$TAG_MSG"

      # 用 runner 预装的 gh CLI（github.token 授权），避免第三方 action 的解析/权限问题
      - name: 创建 GitHub Release 并上传产物
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 重跑时 release 可能已存在：不视为失败；上传用 --clobber 整套覆盖，
          # 保证 exe / .sig / latest.json 三者永远出自同一构建（签名才一致）
          gh release create "${{ github.ref_name }}" \
            --title "DiskLens ${{ github.ref_name }}" \
            --generate-notes --latest || true
          gh release upload --clobber "${{ github.ref_name }}" \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/nsis/*.exe.sig \
            dist/latest.json \
            "disklens-${{ github.ref_name }}.exe"

      # 清单必须与 Release 上的 exe 出自同一构建，签名才匹配。
      # v1.2.0 事故复盘：本地构建的清单先 scp 到了服务器，CI 随后重新构建上传了
      # 新 exe（Rust/NSIS 构建非字节可重现），服务器旧签名 ≠ Release 新 exe，
      # 客户端报 The signature verification failed。CI 在此自动同步，杜绝再犯。
      # v1.3.1 复盘：官网下载页的版本化直链 /downloads/disklens/v*/ 同理，
      # 安装包也由 CI 从本次构建直传，与 Release、latest.json 三方字节一致，
      # 下载页 SHA256 校验值可放心引用；否则发版后直链 404、页面停在旧版本。
      - name: 同步更新清单与安装包到 ikanp.top
        if: env.IKANP_SSH_HOST != ''
        shell: bash
        env:
          IKANP_SSH_USER: ${{ secrets.IKANP_SSH_USER }}
          IKANP_SSH_KEY: ${{ secrets.IKANP_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$IKANP_SSH_KEY" > ~/.ssh/ikanp_deploy_key
          chmod 600 ~/.ssh/ikanp_deploy_key
          ssh -i ~/.ssh/ikanp_deploy_key -o StrictHostKeyChecking=accept-new \
            "$IKANP_SSH_USER@$IKANP_SSH_HOST" \
            "mkdir -p /usr/share/nginx/ikanp-home/downloads/disklens/${{ github.ref_name }}"
          scp -i ~/.ssh/ikanp_deploy_key -o StrictHostKeyChecking=accept-new \
            dist/latest.json \
            "$IKANP_SSH_USER@$IKANP_SSH_HOST:/usr/share/nginx/ikanp-home/downloads/disklens/latest.json"
          scp -i ~/.ssh/ikanp_deploy_key -o StrictHostKeyChecking=accept-new \
            src-tauri/target/release/bundle/nsis/*.exe \
            "disklens-${{ github.ref_name }}.exe" \
            "$IKANP_SSH_USER@$IKANP_SSH_HOST:/usr/share/nginx/ikanp-home/downloads/disklens/${{ github.ref_name }}/"
          rm -f ~/.ssh/ikanp_deploy_key

      # 官网还有两处不随本仓库发版自动更新的内容——更新日志条目与下载页版本/
      # 校验值（都在 aliyun 仓库，需按其 DEPLOY.md 重新发布主页）。这里把本次
      # 构建的关键信息打在日志里，照抄即可，漏了官网就会停留在旧版本。
      - name: 发版收尾提醒（官网两处待同步）
        shell: bash
        run: |
          SETUP=$(ls src-tauri/target/release/bundle/nsis/*.exe)
          echo "============================================================"
          echo "⚠ 发版未完全收尾：ikanp.top 官网还有两处要手动同步（aliyun 仓库）"
          echo "1) 更新日志条目 ikanp-home/ik-changelog/data.js —— disklens 分组"
          echo "   最前面加一条「DiskLens ${{ github.ref_name }} 上线」，内容用本次 tag 说明"
          echo "2) 下载页 ikanp-home/disklens/index.html —— 三处链接改到"
          echo "   /downloads/disklens/${{ github.ref_name }}/，SHA256 替换为："
          sha256sum "$SETUP" "disklens-${{ github.ref_name }}.exe"
          echo "   （安装包与清单已自动传到服务器；若上一步被跳过需手动补传）"
          echo "3) 改完 aliyun 仓库执行主页发布（node tools/protect/run.mjs home，见其 DEPLOY.md）"
          echo "============================================================"
