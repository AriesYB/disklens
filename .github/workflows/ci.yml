# DiskLens CI：Rust 测试（多平台）+ 浏览器 e2e 冒烟（Windows）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]   # 跨平台编译验证（非 Windows 走桩代码路径）
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  e2e:
    runs-on: windows-latest   # 演示模式全量交互只在 Windows 验（与真实使用环境一致）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
